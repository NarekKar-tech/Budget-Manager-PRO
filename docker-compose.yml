services:

  backend:
    build:
      context: ./backend

    container_name: budget-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: budget-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    depends_on:
      - backend