
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secret
  labels:
    {{- include "budget.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "databasePassword is required" .Values.secrets.databasePassword | quote }}
  SECRET_KEY: {{ required "secretKey is required" .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres-service:%v/%s" .Values.database.user (.Values.secrets.databasePassword | urlquery) .Release.Name .Values.database.port .Values.database.name | quote }}