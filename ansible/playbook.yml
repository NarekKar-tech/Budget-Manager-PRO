---
- name: Configure EC2 and deploy app
  hosts: aws_ec2
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker, Compose and Git
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - git
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Clone project repository
      git:
        repo: "https://github.com/NarekKar-tech/Budget-Manager-PRO.git"
        dest: /home/ubuntu/budget-manager-pro
        version: test-bud-pro
        force: true
      become_user: ubuntu

    - name: Copy environment file
      copy:
        src: ../.env
        dest: /home/ubuntu/budget-manager-pro/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Set frontend API URL using EC2 public IP
      lineinfile:
        path: /home/ubuntu/budget-manager-pro/.env
        regexp: '^NEXT_PUBLIC_API_URL='
        line: "NEXT_PUBLIC_API_URL=http://{{ inventory_hostname }}:8000/api/v1"
        create: true

    - name: Set frontend URL for backend CORS
      lineinfile:
        path: /home/ubuntu/budget-manager-pro/.env
        regexp: '^FRONTEND_URL='
        line: "FRONTEND_URL=http://{{ inventory_hostname }}:3000"
        create: true

    - name: Start Docker Compose stack
      command:
        cmd: docker compose up -d --build
        chdir: /home/ubuntu/budget-manager-pro
      changed_when: false

    - name: Run database migrations
      command:
        cmd: docker exec budget-backend alembic upgrade head
      changed_when: false
