
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: budget-manager
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: budget-frontend:v1.5
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"

          env:
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: budget-manager
spec:
  type: NodePort

  selector:
    app: frontend

  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
