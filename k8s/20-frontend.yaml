apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: budget-manager
  labels:
    app: frontend
spec:
  containers:
    - name: frontend
      image: budget-frontend:v1.4
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: budget-manager
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000