apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: budget-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: budget-backend:v1.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://budget_admin:CHANGE_ME@postgres-service:5432/budget_manager_pro"
            - name: SECRET_KEY
              value: "CHANGE_ME"
            - name: CORS_ORIGINS
              value: "http://192.168.49.2:32739,http://localhost:3000"
            - name: FRONTEND_URL
              value: "http://192.168.49.2:32739"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: budget-manager
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000