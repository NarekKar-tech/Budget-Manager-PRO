name: Budget Manager Pro CI

on:
  push:
    branches:
      - hw36
  workflow_dispatch:
permissions:
  contents: write

jobs:
  ci:
    name: Build and Test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show commit
        run: git rev-parse --short HEAD

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test backend with Python 3.12
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/backend:/app" \
            -w /app \
            python:3.12-slim \
            sh -c "pip install --user -r requirements-dev.txt && python -m pytest -p no:cacheprovider tests/test_health.py -v"

      - name: Lint Helm Chart
        run: helm lint ./chart -f ./chart/values-dev.yaml

      - name: Build backend Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build \
            -f backend/Dockerfile \
            -t "budget-backend:${IMAGE_TAG}" \
            ./backend

      - name: Build frontend Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build \
            -f frontend/Dockerfile \
            --build-arg BACKEND_INTERNAL_URL=http://budget-backend-service:8000 \
            -t "budget-frontend:${IMAGE_TAG}" \
            ./frontend

      - name: Load Docker images into Minikube
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          minikube image load "budget-backend:${IMAGE_TAG}"
          minikube image load "budget-frontend:${IMAGE_TAG}"

      - name: Update Helm image tags
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          python3 - "$IMAGE_TAG" <<'PY'
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          path = Path("chart/values-dev.yaml")
          content = path.read_text()

          for component in ("backend", "frontend"):
              start = content.index(f"{component}:")
              image_start = content.index("  image:", start)
              tag_start = content.index('    tag: "', image_start)
              tag_end = content.index('"', tag_start + len('    tag: "'))

              content = (
                  content[:tag_start]
                  + f'    tag: "{tag}'
                  + content[tag_end:]
              )

          path.write_text(content)
          PY

      - name: Commit and push Helm image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chart/values-dev.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes"
          else
            git commit -m "chore: update dev image tags [skip ci]"
            git push origin HEAD:hw36
          fi